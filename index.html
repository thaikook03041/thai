<!-- JavaScript ระบบการทำงาน (โค้ดฉบับสมบูรณ์) -->
    <script>
        const defaultDatabase = {
            "LF1001": { 
                status: 1, 
                name: "เสื้อยืดคอกลม", 
                code: "TEST001", 
                category: "เสื้อผ้า", 
                location: "A1", 
                qty: "10", 
                unit: "ตัว", 
                timestamp: 1748740000000,
                created: "01/06/2026 10:00", 
                updated: "01/06/2026 10:00" 
            },
            "LF1002": { 
                status: 2, 
                name: "กางเกงยีนส์ขาสั้น", 
                code: "TEST002", 
                category: "กางเกง", 
                location: "A2", 
                qty: "5", 
                unit: "ชิ้น", 
                timestamp: 1748743600000,
                created: "02/06/2026 11:30", 
                updated: "02/06/2026 12:15" 
            }
        };

        const API_URL = 'https://script.google.com/macros/s/AKfycbyAjeBWKnA3hBO4GXb_Kt4erdVoQwkW5EneeBWkdzFZSibhLLF806qIlDotYaTLWuh9/exec';
        let cachedDB = null;
        let jsonpCounter = 0;

        function callSheetAPI(params, timeoutMs = 15000) {
            return new Promise((resolve, reject) => {
                const callbackName = 'sheetCb_' + (jsonpCounter++) + '_' + Date.now();
                const script = document.createElement('script');
                let done = false;

                const cleanup = () => {
                    done = true;
                    delete window[callbackName];
                    script.remove();
                    clearTimeout(timer);
                };

                window[callbackName] = (data) => {
                    if (done) return;
                    cleanup();
                    resolve(data);
                };

                script.onerror = () => {
                    if (done) return;
                    cleanup();
                    reject(new Error('เชื่อมต่อ Google Sheets ไม่สำเร็จ (โหลดสคริปต์ล้มเหลว)'));
                };

                const timer = setTimeout(() => {
                    if (done) return;
                    cleanup();
                    reject(new Error('เชื่อมต่อ Google Sheets หมดเวลา (timeout)'));
                }, timeoutMs);

                const query = new URLSearchParams({ ...params, callback: callbackName }).toString();
                script.src = API_URL + '?' + query;
                document.body.appendChild(script);
            });
        }

        async function initFromSheet() {
            try {
                const result = await callSheetAPI({ action: 'load' });
                if (result.success) {
                    cachedDB = result.data || {};
                    localStorage.setItem('logistics_db', JSON.stringify(cachedDB));

                    if (!document.getElementById('tabAdmin').classList.contains('hidden')) {
                        loadAdminData();
                    }
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('track')) {
                        document.getElementById('trackingInput').value = urlParams.get('track');
                        searchTracking();
                    }
                } else {
                    console.warn('โหลดจาก Google Sheets ไม่สำเร็จ:', result.error);
                }
            } catch (err) {
                console.error('เชื่อมต่อ Google Sheets ไม่สำเร็จ ใช้ข้อมูลในเครื่อง/ตัวอย่างแทนชั่วคราว:', err);
            }
        }
        window.addEventListener('DOMContentLoaded', initFromSheet);

        function getDatabase() {
            if (cachedDB) return cachedDB;
            const data = localStorage.getItem('logistics_db');
            return data ? JSON.parse(data) : defaultDatabase;
        }

        function saveDatabase(db) {
            cachedDB = db;
            localStorage.setItem('logistics_db', JSON.stringify(db));

            callSheetAPI({ action: 'save', db: JSON.stringify(db) }).catch(err => {
                console.error('บันทึกไป Google Sheets ไม่สำเร็จ:', err);
                alert('บันทึกไป Google Sheets ไม่สำเร็จ: ' + err.message + '\n\n(ข้อมูลยังถูกบันทึกในเครื่องนี้ไว้ก่อน)');
            });
        }

        function getCurrentDateTime() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function switchTab(tab) {
            document.getElementById('tabClient').classList.add('hidden');
            document.getElementById('tabAdmin').classList.add('hidden');
            document.getElementById('btnTabClient').className = "text-sm px-3 py-1.5 rounded-lg hover:bg-indigo-700 font-medium transition";
            document.getElementById('btnTabAdmin').className = "text-sm px-3 py-1.5 rounded-lg hover:bg-indigo-700 font-medium transition";

            if (tab === 'client') {
                document.getElementById('tabClient').classList.remove('hidden');
                document.getElementById('btnTabClient').className = "text-sm px-3 py-1.5 rounded-lg bg-indigo-700 font-medium transition";
            } else if (tab === 'admin') {
                document.getElementById('tabAdmin').classList.remove('hidden');
                document.getElementById('btnTabAdmin').className = "text-sm px-3 py-1.5 rounded-lg bg-indigo-700 font-medium transition";
                loadAdminData();
            }
        }

        function searchTracking() {
            const trackingNo = document.getElementById('trackingInput').value.trim().toUpperCase();
            const db = getDatabase();
            const resultSection = document.getElementById('resultSection');
            const errorSection = document.getElementById('errorSection');

            if (!trackingNo || !db[trackingNo]) {
                resultSection.classList.add('hidden');
                errorSection.classList.remove('hidden');
                return;
            }

            errorSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            const item = db[trackingNo];
            document.getElementById('resTrackingNo').innerText = trackingNo;
            document.getElementById('resProductName').innerText = item.name || 'ไม่ระบุชื่อสินค้า';
            document.getElementById('resProductCode').innerText = item.code ? `SKU: ${item.code}` : 'SKU: -';
            document.getElementById('resProductCategory').innerText = item.category || '-';
            document.getElementById('resProductLocation').innerText = item.location || '-';
            document.getElementById('resProductQty').innerText = item.qty || '-';
            document.getElementById('resProductUnit').innerText = item.unit || '-';
            document.getElementById('resProductCreated').innerText = item.created || '-';
            document.getElementById('resProductUpdated').innerText = item.updated || '-';

            // Reset Timeline
            for (let i = 1; i <= 4; i++) {
                const step = document.getElementById(`step${i}`);
                const circle = step.querySelector('div');
                circle.className = "w-6 h-6 rounded-full bg-slate-200 text-white flex items-center justify-center z-10 text-xs font-bold ring-4 ring-white";
            }

            // Highlight Active Step
            const currentStep = document.getElementById(`step${item.status}`);
            if (currentStep) {
                const circle = currentStep.querySelector('div');
                if (item.status === 4) {
                    circle.className = "w-6 h-6 rounded-full bg-purple-600 text-white flex items-center justify-center z-10 text-xs font-bold ring-4 ring-purple-100";
                } else {
                    circle.className = "w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center z-10 text-xs font-bold ring-4 ring-indigo-100";
                }
            }
        }

        function toggleDetailForm() {
            const checkbox = document.getElementById('toggleDetailCheckbox');
            const section = document.getElementById('productDetailSection');
            if (checkbox.checked) {
                section.classList.remove('hidden');
            } else {
                section.classList.add('hidden');
            }
        }

        function addNewRandomParcel() {
            const db = getDatabase();
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            const newTracking = "LF" + randomNum;
            const nowStr = getCurrentDateTime();

            const isDetailed = document.getElementById('toggleDetailCheckbox').checked;

            if (isDetailed) {
                db[newTracking] = {
                    status: 1,
                    name: document.getElementById('inputProductName').value || "สินค้าไม่มีชื่อ",
                    code: document.getElementById('inputProductCode').value || "-",
                    category: document.getElementById('inputProductCategory').value || "-",
                    location: document.getElementById('inputProductLocation').value || "-",
                    qty: document.getElementById('inputProductQty').value || "1",
                    unit: document.getElementById('inputProductUnit').value || "ชิ้น",
                    timestamp: Date.now(),
                    created: document.getElementById('inputProductCreated').value || nowStr,
                    updated: nowStr
                };
            } else {
                db[newTracking] = {
                    status: 1,
                    name: "พัสดุลงทะเบียนใหม่",
                    code: "-",
                    category: "-",
                    location: "-",
                    qty: "1",
                    unit: "ชิ้น",
                    timestamp: Date.now(),
                    created: nowStr,
                    updated: nowStr
                };
            }

            saveDatabase(db);
            loadAdminData();
            alert(`สร้างหมายเลขพัสดุสำเร็จ: ${newTracking}`);

            // Reset inputs
            document.getElementById('inputProductName').value = '';
            document.getElementById('inputProductCode').value = '';
            document.getElementById('inputProductCategory').value = '';
            document.getElementById('inputProductLocation').value = '';
            document.getElementById('inputProductQty').value = '';
            document.getElementById('inputProductUnit').value = '';
            document.getElementById('inputProductCreated').value = '';
        }

        function loadAdminData() {
            const db = getDatabase();
            const tableBody = document.getElementById('adminParcelTable');
            const searchKeyword = document.getElementById('adminSearchBox').value.toLowerCase().trim();
            const filterStatus = document.getElementById('adminFilterStatus').value;

            tableBody.innerHTML = '';

            let total = 0, waiting = 0, stored = 0, shipping = 0, check = 0;

            Object.keys(db).reverse().forEach(tracking => {
                const item = db[tracking];
                
                // สถิติ
                total++;
                if (item.status === 1) waiting++;
                else if (item.status === 2) stored++;
                else if (item.status === 3) shipping++;
                else if (item.status === 4) check++;

                // การกรองข้อมูล
                const matchSearch = tracking.toLowerCase().includes(searchKeyword) || 
                                    (item.name && item.name.toLowerCase().includes(searchKeyword)) || 
                                    (item.code && item.code.toLowerCase().includes(searchKeyword));
                const matchStatus = filterStatus === '' || item.status.toString() === filterStatus;

                if (matchSearch && matchStatus) {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-slate-100 hover:bg-slate-50/50 transition";

                    let statusBadge = "";
                    if (item.status === 1) statusBadge = `<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full font-medium">รอรับเข้า</span>`;
                    else if (item.status === 2) statusBadge = `<span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded-full font-medium">จัดเก็บแล้ว</span>`;
                    else if (item.status === 3) statusBadge = `<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-medium">พร้อมจัดส่ง</span>`;
                    else if (item.status === 4) statusBadge = `<span class="bg-purple-100 text-purple-700 text-xs px-2.5 py-1 rounded-full font-medium">ต้องตรวจสอบ</span>`;

                    tr.innerHTML = `
                        <td class="py-3 text-center"><input type="checkbox" value="${tracking}" onchange="updateBulkActionButtons()" class="parcel-checkbox rounded border-slate-300"></td>
                        <td class="py-3">
                            <div class="font-bold text-indigo-600">${tracking}</div>
                            <div class="text-xs text-slate-500 font-medium">${item.name || '-'} ${item.code ? `(${item.code})` : ''}</div>
                        </td>
                        <td class="py-3">${statusBadge}</td>
                        <td class="py-3 text-center">
                            <div class="flex justify-center gap-1.5">
                                <button onclick="viewTrackingDetail('${tracking}')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-1.5 rounded-lg text-xs" title="ดูข้อมูล">👁️</button>
                                <button onclick="openEditParcelModal('${tracking}')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-1.5 rounded-lg text-xs" title="แก้ไข">✏️</button>
                                <button onclick="openStickerModal('${tracking}')" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-1.5 rounded-lg text-xs" title="พิมพ์ QR Code">🖨️</button>
                                <button onclick="deleteSingleParcel('${tracking}')" class="bg-red-50 hover:bg-red-100 text-red-600 p-1.5 rounded-lg text-xs" title="ลบ">🗑️</button>
                            </div>
                        </td>
                        <td class="py-3 text-right">
                            <select onchange="updateParcelStatus('${tracking}', this.value)" class="text-xs border border-slate-200 rounded-lg px-2 py-1 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <option value="1" ${item.status === 1 ? 'selected' : ''}>รอรับเข้า</option>
                                <option value="2" ${item.status === 2 ? 'selected' : ''}>จัดเก็บแล้ว</option>
                                <option value="3" ${item.status === 3 ? 'selected' : ''}>พร้อมจัดส่ง</option>
                                <option value="4" ${item.status === 4 ? 'selected' : ''}>ต้องตรวจสอบ</option>
                            </select>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                }
            });

            // อัปเดตการ์ดสถิติ
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statWaiting').innerText = waiting;
            document.getElementById('statStored').innerText = stored;
            document.getElementById('statShipping').innerText = shipping;
            document.getElementById('statCheck').innerText = check;

            updateBulkActionButtons();
        }

        function updateParcelStatus(tracking, newStatus) {
            const db = getDatabase();
            if (db[tracking]) {
                db[tracking].status = parseInt(newStatus);
                db[tracking].updated = getCurrentDateTime();
                saveDatabase(db);
                loadAdminData();
            }
        }

        function viewTrackingDetail(tracking) {
            switchTab('client');
            document.getElementById('trackingInput').value = tracking;
            document.getElementById('backToAdminContainer').classList.remove('hidden');
            searchTracking();
        }

        function goBackToAdmin() {
            document.getElementById('backToAdminContainer').classList.add('hidden');
            switchTab('admin');
        }

        function deleteSingleParcel(tracking) {
            if (confirm(`คุณต้องการลบรายการพัสดุ ${tracking} ใช่หรือไม่?`)) {
                const db = getDatabase();
                delete db[tracking];
                saveDatabase(db);
                loadAdminData();
            }
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.parcel-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
            updateBulkActionButtons();
        }

        function updateBulkActionButtons() {
            const selected = document.querySelectorAll('.parcel-checkbox:checked');
            const btnDelete = document.getElementById('btnBulkDelete');
            const btnPrint = document.getElementById('btnBulkPrint');

            if (selected.length > 0) {
                btnDelete.classList.remove('hidden');
                btnPrint.classList.remove('hidden');
            } else {
                btnDelete.classList.add('hidden');
                btnPrint.classList.add('hidden');
            }
        }

        function deleteSelectedParcels() {
            const selected = document.querySelectorAll('.parcel-checkbox:checked');
            if (selected.length === 0) return;

            if (confirm(`คุณต้องการลบพัสดุจำนวน ${selected.length} รายการที่เลือกใช่หรือไม่?`)) {
                const db = getDatabase();
                selected.forEach(cb => {
                    delete db[cb.value];
                });
                saveDatabase(db);
                document.getElementById('selectAll').checked = false;
                loadAdminData();
            }
        }

        // ================= QR Code & Modal =================
        function openStickerModal(tracking) {
            const db = getDatabase();
            const item = db[tracking];
            if (!item) return;

            document.getElementById('stickerTrackingNo').innerText = tracking;
            document.getElementById('stkProductName').innerText = item.name || '-';
            document.getElementById('stkProductCode').innerText = `รหัส: ${item.code || '-'}`;
            document.getElementById('stkProductLoc').innerText = `ตำแหน่ง: ${item.location || '-'}`;
            document.getElementById('stickerProductDetails').classList.remove('hidden');

            const qrContainer = document.getElementById('stickerQrcode');
            qrContainer.innerHTML = '';

            const trackingUrl = window.location.origin + window.location.pathname + '?track=' + tracking;
            new QRCode(qrContainer, {
                text: trackingUrl,
                width: 128,
                height: 128
            });

            document.getElementById('printStickerModal').classList.remove('hidden');
            document.getElementById('printStickerModal').classList.add('flex');
        }

        function closeStickerModal() {
            document.getElementById('printStickerModal').classList.add('hidden');
            document.getElementById('printStickerModal').classList.remove('flex');
        }

        function openBulkPrintModal() {
            const selected = document.querySelectorAll('.parcel-checkbox:checked');
            if (selected.length === 0) return;

            const db = getDatabase();
            const container = document.getElementById('multiPrintContainer');
            container.innerHTML = '';

            selected.forEach(cb => {
                const tracking = cb.value;
                const item = db[tracking];
                if (!item) return;

                const sticker = document.createElement('div');
                sticker.className = 'sticker-item';

                const trackingUrl = window.location.origin + window.location.pathname + '?track=' + tracking;
                const qrId = 'qr_' + tracking;

                sticker.innerHTML = `
                    <div style="font-size: 10px; font-weight: bold; color: #888; text-transform: uppercase;">LogisticsFlow Express</div>
                    <div style="font-size: 20px; font-weight: 900; margin-bottom: 5px;">${tracking}</div>
                    <div style="font-size: 12px; font-weight: bold; text-align: left; background: #f8fafc; padding: 5px; border-radius: 5px; margin-bottom: 5px;">
                        <div>${item.name || '-'}</div>
                        <div style="font-size: 10px; color: #666; font-weight: normal;">รหัส: ${item.code || '-'} | ตำแหน่ง: ${item.location || '-'}</div>
                    </div>
                    <div id="${qrId}" style="display: flex; justify-content: center; margin: 8px 0;"></div>
                    <div style="font-size: 9px; color: #888;">สแกนเพื่อตรวจสอบสถานะพัสดุ</div>
                `;
                container.appendChild(sticker);

                setTimeout(() => {
                    new QRCode(document.getElementById(qrId), {
                        text: trackingUrl,
                        width: 100,
                        height: 100
                    });
                }, 50);
            });

            setTimeout(() => {
                window.print();
            }, 300);
        }

        // ================= Modal Edit =================
        let currentEditingTracking = null;

        function openEditParcelModal(tracking) {
            const db = getDatabase();
            const item = db[tracking];
            if (!item) return;

            currentEditingTracking = tracking;
            document.getElementById('editParcelTrackingNo').innerText = tracking;
            document.getElementById('editInputName').value = item.name || '';
            document.getElementById('editInputCode').value = item.code || '';
            document.getElementById('editInputCategory').value = item.category || '';
            document.getElementById('editInputLocation').value = item.location || '';
            document.getElementById('editInputQty').value = item.qty || '';
            document.getElementById('editInputUnit').value = item.unit || '';

            document.getElementById('editParcelModal').classList.remove('hidden');
            document.getElementById('editParcelModal').classList.add('flex');
        }

        function closeEditParcelModal() {
            currentEditingTracking = null;
            document.getElementById('editParcelModal').classList.add('hidden');
            document.getElementById('editParcelModal').classList.remove('flex');
        }

        function saveEditedParcel(e) {
            e.preventDefault();
            if (!currentEditingTracking) return;

            const db = getDatabase();
            if (db[currentEditingTracking]) {
                db[currentEditingTracking].name = document.getElementById('editInputName').value;
                db[currentEditingTracking].code = document.getElementById('editInputCode').value;
                db[currentEditingTracking].category = document.getElementById('editInputCategory').value;
                db[currentEditingTracking].location = document.getElementById('editInputLocation').value;
                db[currentEditingTracking].qty = document.getElementById('editInputQty').value;
                db[currentEditingTracking].unit = document.getElementById('editInputUnit').value;
                db[currentEditingTracking].updated = getCurrentDateTime();

                saveDatabase(db);
                loadAdminData();
                closeEditParcelModal();
            }
        }
    </script>
</body>
</html>
